[project]
name = "phantom-transfer-persona-vector"
version = "0.1.0"
description = "Persona-style steering vectors for phantom-transfer entities"
requires-python = ">=3.10"
dependencies = [
    "accelerate",
    "datasets",
    "fire",
    "huggingface_hub",
    "matplotlib",
    "numpy",
    "openai",
    "pandas",
    "peft",
    "pydantic>=1.10.13",
    "python-dotenv",
    "scipy",
    "torch",
    "tqdm",
    "transformers",
    "trl==0.22.2",
    "unsloth>=2026",
    "vllm>=0.18",
    "filelock",
    "wandb",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
